name: CI and deploy to Dokploy

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: Verify Go and Docker
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod

      - name: Verify modules, vet, and test
        run: |
          go mod tidy -diff
          go mod verify
          go vet -mod=readonly ./...
          go test -mod=readonly -count=1 ./...

      - name: Check Docker build
        if: github.event_name == 'pull_request'
        run: docker build --platform linux/amd64 --tag kunime-ci .

  publish:
    name: Publish Docker image
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check master still points to this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          head_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/master" --jq .object.sha)
          if [[ "$head_sha" != "$GITHUB_SHA" ]]; then
            echo "::error::This run was superseded. Publish from the current master commit."
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Image metadata
        id: image
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha,format=long

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build and push to GHCR
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.image.outputs.tags }}
          labels: ${{ steps.image.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Request Dokploy deployment
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    permissions: {}
    steps:
      - name: Trigger application webhook
        env:
          DOKPLOY_WEBHOOK_URL: ${{ secrets.DOKPLOY_WEBHOOK_URL }}
        run: |
          if [[ "$DOKPLOY_WEBHOOK_URL" != https://* ]]; then
            echo "::error::DOKPLOY_WEBHOOK_URL must contain the HTTPS application webhook URL."
            exit 1
          fi

          if ! status=$(curl --globoff --proto '=https' --silent --output /dev/null \
            --write-out '%{http_code}' --connect-timeout 10 --max-time 30 \
            --request POST --url "$DOKPLOY_WEBHOOK_URL"); then
            echo "::error::Could not reach the Dokploy webhook or verify its TLS certificate."
            exit 1
          fi

          case "$status" in
            2??) echo "Dokploy accepted the deployment request (HTTP $status)." ;;
            *) echo "::error::Dokploy webhook returned HTTP $status."; exit 1 ;;
          esac
